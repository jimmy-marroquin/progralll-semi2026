<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Parcial II</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
        .login-card h2 { text-align: center; color: #333; }
        .login-card label { display: block; margin-top: 10px; font-size: 14px; }
        .login-card input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .login-card button { width: 100%; background-color: #007BFF; color: white; border: none; padding: 10px; margin-top: 15px; border-radius: 4px; cursor: pointer; }
        .login-card button:hover { background-color: #0056b3; }
        .error { color: red; font-size: 13px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Iniciar Sesión</h2>
        <form method="POST">
            <label>Usuario:</label>
            <input type="text" name="usuario" required>
            <label>Clave:</label>
            <input type="password" name="clave" required>
            <button type="submit">Ingresar</button>
        </form>
        {% if mensaje %}
            <p class="error">{{ mensaje }}</p>
        {% endif %}
    </div>
</body>
</html>
